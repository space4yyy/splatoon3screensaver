name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: Build .saver
    # Xcode 16 still bundles the Metal compiler. Xcode 26 and newer need the
    # separate Metal Toolchain, which the macOS 26 images do not reliably
    # install yet (actions/runner-images#13014).
    runs-on: macos-15
    timeout-minutes: 20
    permissions:
      # Publishing the release for v* tags.
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Show toolchain
        run: |
          xcodebuild -version
          swiftc --version
          xcrun -sdk macosx metal --version

      - name: Build universal screensaver
        run: |
          version=""
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          fi
          make package ARCHS="arm64 x86_64" VERSION="$version" BUILD_NUMBER="$GITHUB_RUN_NUMBER"

      - name: Verify bundle
        run: |
          contents=dist/splatoon3-boot.saver/Contents
          for arch in arm64 x86_64; do
            lipo "$contents/MacOS/Splatoon3Screensaver" -verify_arch "$arch"
          done
          test -s "$contents/Resources/default.metallib"
          plutil -lint "$contents/Info.plist"
          plutil -p "$contents/Info.plist" | grep -E '"CFBundle(ShortVersionString|Version)"'

      - name: Package release zip
        run: ditto -c -k --keepParent --norsrc --noextattr dist/splatoon3-boot.saver dist/splatoon3-boot.saver.zip

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: splatoon3-boot.saver.zip
          path: dist/splatoon3-boot.saver.zip
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/splatoon3-boot.saver.zip --clobber
          else
            # Install and notarization notes come first; generated notes follow.
            gh release create "$GITHUB_REF_NAME" dist/splatoon3-boot.saver.zip \
              --title "$GITHUB_REF_NAME" \
              --generate-notes \
              --notes-file .github/release-notes.md
          fi
